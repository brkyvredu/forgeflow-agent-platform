services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeflow}
      POSTGRES_USER: ${POSTGRES_USER:-forgeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgeflow} -d ${POSTGRES_DB:-forgeflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/jaeger:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14317:4317"

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file: .env
    environment:
      REPOSITORY_ROOT: /workspace/repository
      OTEL_SERVICE_NAME: forgeflow-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    volumes:
      - ./:/workspace/repository:ro
    depends_on:
      - otel-collector
    ports:
      - "8001:8001"

  java-analysis:
    build:
      context: ./services/java-analysis
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - otel-collector
    ports:
      - "8080:8080"

  agent:
    build: .
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      JAVA_ANALYSIS_URL: http://java-analysis:8080
      DATABASE_URL: postgresql://forgeflow:forgeflow@postgres:5432/forgeflow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
      java-analysis:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  postgres-data:
