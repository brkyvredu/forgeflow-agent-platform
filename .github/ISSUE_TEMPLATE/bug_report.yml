name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include relevant logs with secrets removed.
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: ForgeFlow version
    validations: { required: true }
