name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy forgeflow forgeflow_mcp
      - run: pytest

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/java-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  containers:
    runs-on: ubuntu-latest
    needs: [python, java]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forgeflow-agent:test .
      - run: docker build -f Dockerfile.mcp -t forgeflow-mcp:test .
      - run: docker build -t forgeflow-java:test services/java-analysis
