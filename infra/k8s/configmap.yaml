apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeflow-config
  namespace: forgeflow
data:
  FORGEFLOW_MODEL: gemini-3.6-flash
  FORGEFLOW_EMBEDDING_MODEL: gemini-embedding-001
  FORGEFLOW_EMBEDDING_DIMENSION: "768"
  MCP_SERVER_URL: http://mcp-server:8001/mcp
  JAVA_ANALYSIS_URL: http://java-analysis:8080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  REPOSITORY_ROOT: /workspace/repository
  REPOSITORY_URL: https://github.com/your-org/your-repository.git
